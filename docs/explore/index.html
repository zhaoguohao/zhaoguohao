<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="开着小车探索 zhaoguohao 的 3D 极光岛。">
  <title>极光岛 · zhaoguohao</title>
  <link rel="stylesheet" href="./island.css">
</head>
<body>
  <a class="back" href="../">← 返回个人站</a>
  <main>
    <canvas id="island" aria-label="3D 极光岛，使用方向键或屏幕按钮驾驶小车"></canvas>
    <section class="intro">
      <h1>极光岛</h1>
      <p>开上小车，去看看岛上的三个站点。</p>
    </section>
    <nav class="map" aria-label="岛上站点">
      <a href="https://github.com/zhaoguohao/EZ-Replay-ManagerProject" data-stop="0"><span></span>Unity 工坊</a>
      <a href="../#snake" data-stop="1"><span></span>贪吃蛇观测站</a>
      <a href="../#timeline" data-stop="2"><span></span>时间灯塔</a>
    </nav>
    <p class="status" id="status" role="status">正在加载岛屿…</p>
    <noscript><p class="status">启用 JavaScript 后可驾驶，仍可使用站点链接。</p></noscript>
    <div class="controls" hidden>
      <span class="keys">WASD / 方向键驾驶 · Shift 加速 · Enter 打开站点</span>
      <button id="reset" type="button">回到起点</button>
    </div>
    <div class="drive-pad" aria-label="驾驶方向" hidden>
      <button type="button" data-key="ArrowUp" aria-label="前进">↑</button>
      <button type="button" data-key="ArrowLeft" aria-label="左转">←</button>
      <button type="button" data-key="ArrowDown" aria-label="倒车">↓</button>
      <button type="button" data-key="ArrowRight" aria-label="右转">→</button>
    </div>
    <a id="visit" hidden></a>
  </main>
  <script type="module">
    import('./island.js').then(({startIsland}) => startIsland()).catch(() => {
      document.getElementById('status').textContent = '3D 场景暂时无法打开，可以直接访问上方的站点。';
    });
  </script>
</body>
</html>
