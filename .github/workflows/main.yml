name: Update Aurora profile
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test profile generator
        run: python -m unittest discover -s tests
      - name: Generate public statistics and artwork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/profile.py --owner "${{ github.repository_owner }}"
      - name: Publish successful refresh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/profile
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Aurora public statistics and date'
          git pull --rebase origin master
          git push
