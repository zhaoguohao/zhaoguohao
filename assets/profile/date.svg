<svg xmlns="http://www.w3.org/2000/svg" width="960" height="406" viewBox="0 0 960 406"><rect width="960" height="406" fill="#ffffff"/><g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Arial, PingFang SC, Microsoft YaHei, sans-serif"><text x="52" y="52" font-size="12" fill="#86868b" font-weight="600" text-anchor="start">A WORK IN PROGRESS</text><text x="52" y="104" font-size="36" fill="#1d1d1f" font-weight="700" text-anchor="start">一点探索。</text><text x="52" y="150" font-size="36" fill="#1d1d1f" font-weight="700" text-anchor="start">每天，都算数。</text><text x="550" y="80" font-size="16" fill="#86868b" font-weight="400" text-anchor="start">不必等到完美，才开始创造。</text><text x="550" y="109" font-size="16" fill="#86868b" font-weight="400" text-anchor="start">这里记录想法、尝试，</text><text x="550" y="138" font-size="16" fill="#86868b" font-weight="400" text-anchor="start">以及它们慢慢成为现实的过程。</text><rect x="34" y="192" width="892" height="184" fill="#f5f5f7" rx="18"/><rect x="461" y="192" width="5" height="184" fill="#ffffff" rx="0"/><text x="64" y="230" font-size="14" fill="#86868b" font-weight="400" text-anchor="start">最近更新</text><text x="64" y="294" font-size="52" fill="#1d1d1f" font-weight="600" text-anchor="start">11.13</text><text x="235" y="291" font-size="22" fill="#86868b" font-weight="400" text-anchor="start">2026</text><text x="64" y="339" font-size="14" fill="#86868b" font-weight="400" text-anchor="start">21:51 · UTC+08:00</text><text x="496" y="230" font-size="14" fill="#86868b" font-weight="400" text-anchor="start">这一年的旅程</text><text x="496" y="294" font-size="52" fill="#1d1d1f" font-weight="600" text-anchor="start">86.8%</text><rect x="496" y="316" width="394" height="5" fill="#dfdfe5" rx="3"/><rect x="496" y="316" width="342.09" height="5" fill="#39a8c5" rx="3"/><text x="496" y="346" font-size="13" fill="#86868b" font-weight="400" text-anchor="start">还有新的可能，等待发生。</text></g></svg>